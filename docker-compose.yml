version: '2'
services:
  youtubecoins:
    platform: linux/x86_64
    build: .
    image: youtubecoins
    volumes:
      - .:/var/www/html
      - ./youtubecoins-apache.conf:/etc/apache2/sites-enabled/youtubecoins-apache.conf
    ports:
      - "8085:80"
    depends_on:
      - mysql
  mysql:
    platform: linux/x86_64
    image: mysql:5
    volumes:
      - .docker:/var/lib/mysql    
    ports:
      - "3308:3306"
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: youtubecoins
  memcached:
    image: memcached
    ports:
      - "11212:11211"
  phpmyadmin:
        image: phpmyadmin/phpmyadmin
        links: 
            - mysql:mysql
        ports:
            - 8000:80
        environment:
            MYSQL_HOST: mysql
            MYSQL_USER: root
            MYSQL_PASSWORD: root
            MYSQL_ROOT_PASSWORD: root
            PMA_HOST: mysql
            USER: root
